<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食事スナップ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🍽 食事スナップ</h1>

        <button id="cameraButton">
            写真を撮る
        </button>

        <input
          type="file"
          id="cameraInput"
          accept="image/*"
          capture="environment"
          style="display:none;">

        <img id="preview" style="display:none;">

        <div id="result"></div>

        <button id="savePhotoButton" style="display:none;">
            写真を保存
        </button>

    </div>

<script src="app.js?v=6"></script>

</body>

</html>
